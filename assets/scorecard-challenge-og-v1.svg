<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Codokey — Challenge the Scorecard</title>
  <desc id="description">A dark, technical invitation to independently review Codokey's 32 governance controls, 18 critical controls, and six layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c141c"/>
      <stop offset=".6" stop-color="#090e15"/>
      <stop offset="1" stop-color="#071118"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9aff3d" stop-opacity=".14"/>
      <stop offset="1" stop-color="#9aff3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#b8ff3f"/>
      <stop offset="1" stop-color="#5ddbc8"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#3a4a55" stroke-width=".7" opacity=".32"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="984" cy="316" rx="392" ry="340" fill="url(#glow)"/>
  <rect x="716" y="47" width="484" height="537" fill="url(#grid)" opacity=".52"/>
  <rect width="1200" height="7" fill="url(#edge)"/>
  <rect x="35" y="40" width="1130" height="550" rx="19" fill="none" stroke="#354651" stroke-width="1.4" opacity=".62"/>
  <path d="M72 128H1128" stroke="#34414b" opacity=".75"/>

  <g font-family="Noto Sans, DejaVu Sans, sans-serif" font-weight="800" letter-spacing="-1.4">
    <text x="72" y="108" font-size="41" fill="#edf5f9">Codo<tspan fill="#b8ff3f">key</tspan></text>
  </g>
  <text x="316" y="102" fill="#89a0ab" font-family="DejaVu Sans Mono, monospace" font-size="14.5" letter-spacing="1.3">AI CODE ACCESS GOVERNANCE</text>
  <rect x="936" y="75" width="191" height="28" rx="14" fill="#1b3027" stroke="#426044"/>
  <circle cx="954" cy="89" r="4" fill="#b8ff3f"/>
  <text x="968" y="94" font-family="DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#caf9a5">OPEN TECHNICAL REVIEW</text>

  <text x="70" y="230" font-family="Noto Sans, DejaVu Sans, sans-serif" font-weight="900" font-size="70" fill="#edf5f9" letter-spacing="-2.1">CHALLENGE</text>
  <text x="70" y="313" font-family="Noto Sans, DejaVu Sans, sans-serif" font-weight="900" font-size="65" fill="#b8ff3f" letter-spacing="-2.5">THE SCORECARD</text>
  <path d="M73 347H222" stroke="#b8ff3f" stroke-width="5" stroke-linecap="round"/>
  <text x="72" y="396" font-family="Noto Sans, DejaVu Sans, sans-serif" font-weight="600" font-size="28" fill="#e4ecf0">Can its grades survive scrutiny?</text>
  <text x="72" y="430" font-family="DejaVu Sans Mono, monospace" font-size="16.5" fill="#9fb1c0">Find weak gates. Challenge the assumptions.</text>

  <g font-family="DejaVu Sans Mono, monospace">
    <rect x="72" y="482" width="173" height="55" rx="10" fill="#1a2630" stroke="#3d5055"/>
    <text x="89" y="515" font-size="26" font-weight="700" fill="#b8ff3f">32</text>
    <text x="134" y="513" font-size="12" fill="#c3d1d8" letter-spacing=".5">CONTROLS</text>
    <rect x="259" y="482" width="196" height="55" rx="10" fill="#1a2630" stroke="#3d5055"/>
    <text x="276" y="515" font-size="26" font-weight="700" fill="#b8ff3f">18</text>
    <text x="320" y="513" font-size="12" fill="#c3d1d8" letter-spacing=".5">CRITICAL</text>
    <rect x="469" y="482" width="169" height="55" rx="10" fill="#1a2630" stroke="#3d5055"/>
    <text x="485" y="515" font-size="26" font-weight="700" fill="#b8ff3f">06</text>
    <text x="527" y="513" font-size="12" fill="#c3d1d8" letter-spacing=".5">LAYERS</text>
  </g>

  <rect x="745" y="158" width="385" height="379" rx="17" fill="#000000" opacity=".40" filter="url(#shadow)"/>
  <rect x="745" y="158" width="385" height="379" rx="17" fill="#151f29" stroke="#435660" stroke-width="1.6"/>
  <path d="M762 159H1113" stroke="#b8ff3f" stroke-width="3"/>
  <text x="773" y="195" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#b1c4ce" letter-spacing="1.2">GOVERNANCE / DECISION GATES</text>
  <circle cx="1095" cy="189" r="6" fill="#b8ff3f"/>
  <g font-family="DejaVu Sans Mono, monospace">
    <rect x="770" y="216" width="335" height="74" rx="10" fill="#1c2a33" stroke="#364d57"/>
    <rect x="770" y="216" width="5" height="74" rx="2" fill="#76bbdd"/>
    <text x="790" y="244" font-size="12.5" fill="#839ead">01 / INPUT</text>
    <text x="790" y="270" font-size="19.5" font-weight="700" fill="#ebf3f7">CONTROL EVIDENCE</text>
    <path d="M938 290V310" stroke="#b8ff3f" stroke-width="2" stroke-dasharray="3 4"/>
    <path d="M932 304L938 312L944 304" fill="none" stroke="#b8ff3f" stroke-width="2"/>

    <rect x="770" y="313" width="335" height="74" rx="10" fill="#1c2a33" stroke="#3f6555"/>
    <rect x="770" y="313" width="5" height="74" rx="2" fill="#b8ff3f"/>
    <text x="790" y="340" font-size="12.5" fill="#8fa89b">02 / CHECK</text>
    <text x="790" y="367" font-size="19.5" font-weight="700" fill="#ebf3f7">CRITICAL GATES</text>
    <path d="M938 387V407" stroke="#b8ff3f" stroke-width="2" stroke-dasharray="3 4"/>
    <path d="M932 401L938 409L944 401" fill="none" stroke="#b8ff3f" stroke-width="2"/>

    <rect x="770" y="410" width="335" height="89" rx="10" fill="#203529" stroke="#55764a"/>
    <text x="790" y="441" font-size="12.5" fill="#adc79d">03 / QUESTION</text>
    <text x="790" y="468" font-size="20" font-weight="700" fill="#d8f5c6">IS THE GRADE</text>
    <text x="790" y="490" font-size="20" font-weight="700" fill="#b8ff3f">DEFENSIBLE?</text>
  </g>
  <text x="73" y="574" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#8399a7" letter-spacing="1.1">CODOKEY.COM / REVIEW / SCORECARD-CHALLENGE</text>
  <path d="M1055 565H1125" stroke="#b8ff3f" stroke-width="3" stroke-linecap="round"/>
</svg>
